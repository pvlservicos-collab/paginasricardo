<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/otimizar/marquinhos.webp">
<title>Marquinhos · Otimizar</title>
<link rel="stylesheet" href="/otimizar/style.css">
</head>
<body>
<div class="app">
  <header class="cab">
    <div class="quem">
      <span class="avatar"><img src="/otimizar/marquinhos.webp" alt="" width="48" height="48"></span>
      <div class="nome"><b>Marquinhos</b><span class="status" id="status"><i></i><em>conectando…</em></span></div>
    </div>
    <div class="acoes">
      <button class="ic" id="b-nova" type="button" title="Conversa nova" aria-label="Conversa nova"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <a class="ic so-barra" id="b-cheia" href="/otimizar/terminal.html" target="_blank" rel="noopener" title="Abrir em tela cheia" aria-label="Abrir em tela cheia"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></a>
      <button class="ic so-barra" id="b-fechar" type="button" title="Fechar" aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <a class="ic so-cheia" href="/central#lps" title="Voltar para a Central" aria-label="Voltar para a Central"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    </div>
  </header>
  <main id="tela" class="tela" aria-live="polite"></main>
  <footer class="baixo">
    <div class="rapidas" id="atalhos" aria-label="Mensagens rápidas"></div>
    <form class="caixa" id="form">
      <textarea id="entrada" rows="3" placeholder="Cole o link da página e diga o que quer…" autocomplete="off"></textarea>
      <div class="caixa-pe">
        <span class="dica">Enter envia · Shift+Enter quebra a linha</span>
        <button class="parar" id="b-parar" type="button" hidden>Parar</button>
        <button class="enviar" id="b-enviar" type="submit" aria-label="Enviar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
      </div>
    </form>
  </footer>
</div>
<script src="/otimizar/app.js"></script>
</body>
</html>
